[project]
name = "noecho"
version = "0.1.0"
description = "A self-hostable discussion engine where a thread only accepts unique contributions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Fugate" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/plutado/noecho"

[project.scripts]
noecho-seed = "noecho.seed:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
